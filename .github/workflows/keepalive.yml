# Free Supabase projects pause after about a week without activity. This pings the database once a
# day so a quiet week doesn't take the app down.
#
# Setup (once): GitHub → the repository → Settings → Secrets and variables → Actions →
# "New repository secret":
#   SUPABASE_URL      = https://<project-ref>.supabase.co   (same as EXPO_PUBLIC_SUPABASE_URL)
#   SUPABASE_ANON_KEY = the publishable / anon key          (same as EXPO_PUBLIC_SUPABASE_ANON_KEY)
# Then run it once by hand: Actions → "Keep Supabase awake" → Run workflow.
#
# Note: GitHub turns off scheduled workflows in repositories with no commits for 60 days; it emails
# the owner first, and one click re-enables it.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *' # every day, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set; skipping."
            exit 0
          fi
          for attempt in 1 2 3; do
            if curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
                 -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}'; then
              echo; echo "Supabase is awake."; exit 0
            fi
            echo "Attempt $attempt failed; retrying in 30s"; sleep 30
          done
          echo "::error::Could not reach Supabase. If the project is paused, restore it in the Supabase dashboard."
          exit 1
